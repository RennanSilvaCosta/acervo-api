# Ambiente local: Postgres instalado na maquina, sem SSL.
# Qualquer valor pode ser sobrescrito por variavel de ambiente ou pelo arquivo .env.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:acervo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Sem chave, a busca no Google Books falha e o app usa so a Open Library
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}

logging.level.com.cesta.acervo=DEBUG
