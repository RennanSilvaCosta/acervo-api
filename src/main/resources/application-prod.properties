# Producao: nenhuma variavel tem valor padrao. Se faltar alguma, a aplicacao nao sobe.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Manter "update" ate adotar migrations (Flyway); depois trocar para "validate"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

google.books.api-key=${GOOGLE_BOOKS_API_KEY}

logging.level.root=INFO
logging.level.com.cesta.acervo=INFO

server.error.include-stacktrace=never
server.error.include-binding-errors=never
